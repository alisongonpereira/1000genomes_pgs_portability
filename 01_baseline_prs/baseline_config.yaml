# Stage A -- PRS313_BC (PGS000004) baseline configuration
pgs_id: PGS000004
pgs_name: PRS313_BC
genome_build: GRCh37
n_variants_scorefile: 313
scorefile_source: "PGS Catalog, harmonized (hmPOS), https://ftp.ebi.ac.uk/pub/databases/spot/pgs/scores/PGS000004/ScoringFiles/Harmonized/PGS000004_hmPOS_GRCh37.txt.gz"

target_genotypes:
  source: "1000 Genomes Phase 3 (NCBI mirror), release 20130502"
  n_samples: 2504
  extraction: "bcftools remote region query (-R), exact position, per chromosome"
  n_positions_extracted: 59693  # 313 from the scorefile + 59385 from the ancestry panel (see below)

pipeline:
  tool: pgsc_calc
  version: v2.3.0
  nextflow_version: 26.10.4
  execution_profile: conda (micromamba)
  command: >
    nextflow run pgscatalog/pgsc_calc -profile conda -resume
    --input samplesheet.csv --scorefile PGS000004_hmPOS_GRCh37.txt.gz
    --target_build GRCh37 --max_memory 12.GB --max_cpus 3
    --run_ancestry pgsc_1000G_v1.tar.zst (GRCh37 subset)
    --outdir 01_baseline_prs/pgsc_calc_run

ancestry_panel:
  status: done
  reference_source: "pgsc_calc ancestry reference DB (1000G-only), https://ftp.ebi.ac.uk/pub/databases/spot/pgs/resources/pgsc_1000G_v1.tar.zst"
  download_method: "aria2c (-x5 -s15 -k500M), re-invoked in an external loop with -c (continue) until it finished -- both the plain continuous download and manual curl Range chunks repeatedly failed against this host"
  structural_problem_found: >
    PGS000004's 313 SNPs are not an ancestry panel: after target-bound
    LD-pruning, only 114 markers survived, poorly distributed (several
    chromosomes with zero), breaking the INTERSECT_THINNED step. Resolved
    by extracting a dedicated, genome-wide ancestry panel straight from the
    reference panel itself (1000G GRCh37), independent of the 313-SNP target.
  dedicated_ancestry_panel:
    method: "plink2 QC (geno/mind/maf/hwe, same defaults as pgsc_calc) + --indep-pairwise 1000 50 0.05, excluding high-LD-regions-hg19-GRCh37.txt (a pgsc_calc asset), run directly on the reference panel's GRCh37_1000G_ALL.pgen (84.8M variants before QC)"
    n_markers_after_qc: 3675797
    n_markers_after_pruning: 59385
    distribution: "well distributed across the 22 autosomes (1079-4816 per chromosome), no empty chromosome"
  result: "SUM, Z_MostSimilarPop, Z_norm1, Z_norm2, percentile_MostSimilarPop columns in kgpphase3_pgs.txt.gz; PCA (PC1-10) + RF ancestry assignment in kgpphase3_popsimilarity.txt.gz"
  validation: "pgsc_calc's PCA+RF superpopulation assignment disagrees with the true 1000G panel in only 5/2504 samples (0.20%)"

harmonization:
  policy: "non-ambiguous variants only (A/T, C/G excluded, --keep_ambiguous false) -- Configuration 1 of the Stage B experimental matrix. See 02_harmonization_configs/ for Configuration 2 (--keep_ambiguous true)."
  missing_genotypes: >
    CORRECTION: in practice this ran with mean-imputation (plink2 --score's
    default), not exclusion -- pgsc_calc's logic only applies
    no-mean-imputation when n_samples<50 (our target has 2504). No practical
    effect: 1000G Phase 3's integrated VCF has zero missing genotypes
    (F_MISS=0 at every checked variant), so exclude vs. impute gives an
    identical result here. See 02_harmonization_configs/config.yaml for details.

variant_match_summary:
  matched: 274          # 87.5%
  excluded_ambiguous: 30  # 9.6% -- excluded by design (see policy above)
  unmatched: 9           # 2.9% -- multiallelic sites in 1000G Phase 3,
                          # dropped by pgsc_calc's plink2 --max-alleles 2
                          # before matching (manually verified against the
                          # raw VCF -- not an extraction failure nor a true
                          # absence from 1000G)
  total: 313

output_metric: SUM  # raw score (sum of dosage x weight); AVG also available
denom_per_sample: 548  # 2 x 274 matched variants (diploid)

notes:
  - "The number of variants used (274) is lower than the ~290-292 benchmark reported
     for a cohort imputed against 1000G: the gap is explained by the 9 multiallelic
     sites, which imputation tools typically already split into biallelic records
     before scoring, avoiding this specific exclusion."
  - "Z_norm1/Z_norm2/Z_MostSimilarPop pull the mean to near zero (-0.02 to 0.03) and
     normalize the SD (~0.95-1.09) in EVERY superpopulation, versus means of -0.01 to
     -0.57 and SDs of 0.52-0.61 in the raw SUM. Empirically confirms Section 4 of
     PROJECT_PLAN.md: ancestry normalization removes distributional differences between
     populations by construction -- this does not mean the genetic difference
     'disappeared', it is the transformation that produces that appearance."
